ext {
    glide_version = '4.12.0'
    timber_version = '4.7.1'
    view_binding_property_delegate_version = '1.4.4'
    deps = [
            glide              : "com.github.bumptech.glide:glide:$glide_version",
            timber             : "com.jakewharton.timber:timber:$timber_version",
            viewBindingPD      : "com.github.kirich1409:viewbindingpropertydelegate-noreflection:$view_binding_property_delegate_version",
    ]

    adapterDelegates_version = '4.3.0'
    adapterDelegates = [
            adapter            : "com.hannesdorfmann:adapterdelegates4-kotlin-dsl-viewbinding:$adapterDelegates_version",
            pagination         : "com.hannesdorfmann:adapterdelegates4-pagination:$adapterDelegates_version"
    ]

    koin_version = '3.0.1'
    koinDeps = [
            koin               : "io.insert-koin:koin-android:$koin_version",
            koinExt            : "io.insert-koin:koin-android-ext:$koin_version"
    ]

    room_version = '2.3.0'
    roomDeps = [
            room               : "androidx.room:room-runtime:$room_version",
            roomKtx            : "androidx.room:room-ktx:$room_version",
    ]

    retrofit_version = '2.9.0'
    loggingInterceptor_version = '4.9.1'
    serialization_converter_version = '0.8.0'
    coroutines_adapter_version = '0.9.2'
    retrofitDeps = [
            retrofit               : "com.squareup.retrofit2:retrofit:$retrofit_version",
            loggingInterceptor     : "com.squareup.okhttp3:logging-interceptor:$loggingInterceptor_version",
            serialization_converter: "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:$serialization_converter_version",
            coroutines_adapter     : "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:$coroutines_adapter_version"
    ]

    corutines_version = '1.5.0-RC'
    coroutinesDeps = [
            coroutines      : "org.jetbrains.kotlinx:kotlinx-coroutines-core:$corutines_version",
            corutinesAndroid: "org.jetbrains.kotlinx:kotlinx-coroutines-android:$corutines_version",
    ]

    annotations_version = '16.0.1'
    serialization_version = '1.2.2'
    kotlinDeps = [
            kotlin             : "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version",
            reflect            : "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version",
            annotations        : "org.jetbrains:annotations:$annotations_version",
            serialization      : "org.jetbrains.kotlinx:kotlinx-serialization-json:$serialization_version"
    ]


    lifecycle_version = '2.4.0-alpha03'
    lifecycleDeps = [
            viewmodelKtx        : "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version",
            runtimeKtx          : "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version",
            viewmodelSavedstate : "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
    ]

    material_version = "1.4.0"
    constraint_version = '2.1.0'
    recyclerView_version = '1.2.0'
    insetter_version = "0.6.0"
    zoomage_version = "1.3.1"
    lottie_version = "4.1.0"
    paging_version = "3.0.1"
    viewDeps = [
            material      : "com.google.android.material:material:$material_version",
            constraint    : "androidx.constraintlayout:constraintlayout:$constraint_version",
            recyclerView  : "androidx.recyclerview:recyclerview:$recyclerView_version",
            paging_runtime: "androidx.paging:paging-runtime:$paging_version",
            insetter      : "dev.chrisbanes.insetter:insetter:$insetter_version",
            zoomage       : "com.jsibbold:zoomage:$zoomage_version",
            lottie        : "com.airbnb.android:lottie:$lottie_version"
    ]

    androidX_version = '1.6.0'
    appCompat_version = '1.3.1'
    legacy_version = "1.0.0"
    supportDeps = [
            appCompat          : "androidx.appcompat:appcompat:$appCompat_version",
            appAndroidXCore    : "androidx.core:core-ktx:$androidX_version",
    ]

    activityExt_version = "1.2.0"
    fragmentExt_version = "1.3.0"
    extensionsDeps = [
            activityExt        : "androidx.activity:activity-ktx:$activityExt_version",
            fragmentExt        : "androidx.fragment:fragment-ktx:$fragmentExt_version"
    ]

    navDeps = [
            cicerone  :  "com.github.terrakok:cicerone:7.0"
    ]

    apts = [
            lifecycleExtApt    : "androidx.lifecycle:lifecycle-compiler:$lifecycle_version",
            roomApt            : "androidx.room:room-compiler:$room_version",
            glideApt           : "com.github.bumptech.glide:compiler:$glide_version"
    ]


    // Test dependencies
    junit_version = '4.12'
    ext_junit_version = '1.1.2'
    supportTestRunner_version = '1.3.1-alpha01'
    threeteenabp_test_version = '1.5.1'
    espresso_version = '3.4.0-alpha01'
    mockk_version = '1.10.2'
    coroutines_test_version = '1.5.1'
    logback_classic_version = '1.2.3'
    testDeps = [
            junit            : "junit:junit:$junit_version",
            extJunit         : "androidx.test.ext:junit:$ext_junit_version",
            androidTest      : "android.arch.core:core-testing:$ext_junit_version",

            corutinesTest    : "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_test_version",
            kotlinJunit      : "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version",
            kotlinTest       : "org.jetbrains.kotlin:kotlin-test:$kotlin_version",

            timber           : "com.jakewharton.timber:timber:$timber_version",

            supportTestRunner: "androidx.test:runner:$supportTestRunner_version",
            espressoCore     : "androidx.test.espresso:espresso-core:$espresso_version",

            roomTesting      : "androidx.room:room-testing:$room_version",

            mockk            : "io.mockk:mockk:$mockk_version",

            threetenabp      : "org.threeten:threetenbp:$threeteenabp_test_version",

            logbackClassic   : "ch.qos.logback:logback-classic:$logback_classic_version"
    ]
}
